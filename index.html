<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  
  <!-- SEO & WhatsApp Preview (Open Graph) -->
  <title>Pagamento Pix – PERMUPAY LTDA</title>
  <meta name="description" content="Checkout seguro para pagamento via Pix da PERMUPAY LTDA." />
  
  <!-- Open Graph / WhatsApp -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://pix.permupay.com.br/" />
  <meta property="og:title" content="💳 Pagamento Pix: PERMUPAY LTDA" />
  <meta property="og:description" content="Acesse o checkout seguro. Copie a chave Pix ou escaneie o QR Code." />
  <meta property="og:image" content="https://pix.permupay.com.br/og-image.png" />

  <link rel="icon" type="image/png" href="https://pix.permupay.com.br/qrcode_pix.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  
  <style>
    :root {
      --primary: #0066ff;
      --secondary: #00ffcc;
      --bg: #0a0f1e;
      --card-bg: rgba(255, 255, 255, 0.04);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: #fff;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden; /* Impede scroll no mobile */
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(circle at 20% 10%, rgba(0, 102, 255, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 90%, rgba(0, 200, 180, 0.1) 0%, transparent 50%);
      z-index: -1;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Header Compacto */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5px;
    }

    .logo-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: var(--primary);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
    }

    .company-info h1 {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .company-info p {
      font-size: 10px;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .badge {
      background: rgba(0, 255, 204, 0.1);
      color: var(--secondary);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
      border: 1px solid rgba(0, 255, 204, 0.2);
    }

    /* Card Principal */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .qr-title {
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 15px;
    }

    .qr-wrapper {
      background: #fff;
      padding: 12px;
      border-radius: 18px;
      display: inline-block;
      margin-bottom: 15px;
      box-shadow: 0 10px 30px rgba(0,102,255,0.2);
    }

    .qr-wrapper img {
      display: block;
      width: 180px;
      height: 180px;
    }

    /* Chave e Botão */
    .pix-box {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 12px;
      margin-top: 5px;
    }

    .pix-label {
      font-size: 9px;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .pix-key {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #fff;
    }

    .copy-btn {
      width: 100%;
      background: linear-gradient(135deg, #0052cc, #0066ff);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.2s;
    }

    .copy-btn:active { transform: scale(0.98); }

    /* Footer Minimalista */
    .footer {
      text-align: center;
      font-size: 10px;
      color: rgba(255,255,255,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .dot { width: 5px; height: 5px; background: var(--secondary); border-radius: 50%; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--secondary);
      color: #0a0f1e;
      padding: 8px 20px;
      border-radius: 50px;
      font-size: 12px;
      font-weight: 700;
      transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* Ajuste para Desktop */
    @media (min-height: 700px) {
      .qr-wrapper img { width: 220px; height: 220px; }
      .container { gap: 20px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo-box">
        <div class="logo-icon">PP</div>
        <div class="company-info">
          <h1>PERMUPAY</h1>
          <p>Pagamentos</p>
        </div>
      </div>
      <div class="badge">PIX ATIVO</div>
    </header>

    <!-- Card Principal -->
    <main class="card">
      <div class="qr-title">Escaneie para Pagar</div>
      <div class="qr-wrapper">
        <img src="https://pix.permupay.com.br/qrcode_pix.png" alt="QR Code Pix">
      </div>

      <div class="pix-box">
        <div class="pix-label">Chave CNPJ</div>
        <div class="pix-key">61.281.938/0001-11</div>
        
        <button class="copy-btn" onclick="copyPix()">
          <span>📋</span> COPIAR PIX COPIA E COLA
        </button>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="dot"></div>
      <span>Ambiente Seguro • Banco Central</span>
    </footer>
  </div>

  <div class="toast" id="toast">CÓDIGO PIX COPIADO!</div>

  <script>
    function copyPix() {
      const code = "00020126360014BR.GOV.BCB.PIX0114612819380001115204000053039865802BR5913PERMUPAY LTDA6008BRASILIA62070503***630427BB";
      const toast = document.getElementById('toast');
      
      navigator.clipboard.writeText(code).then(() => {
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
      }).catch(() => {
        const el = document.createElement('textarea');
        el.value = code;
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
      });
    }
  </script>
</body>
</html>
